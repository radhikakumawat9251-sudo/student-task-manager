<!DOCTYPE html>
<html>
<head>
  <title>Student Task Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #eef2ff;
      text-align: center;
      padding: 30px;
    }
    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
    }
    input {
      padding: 10px;
      width: 55%;
    }
    button {
      padding: 10px;
      background: blue;
      color: white;
      border: none;
    }
    li {
      margin: 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>My Task Manager</h1>
    <input id="task" placeholder="Enter your task">
    <button onclick="addTask()">Add</button>
    <ul id="list"></ul>
  </div>

  <script>
    function addTask() {
      let input = document.getElementById("task");
      let value = input.value.trim();

      if (value === "") {
        alert("Enter a task first!");
        return;
      }

      let li = document.createElement("li");
      li.textContent = value + " ";

      let btn = document.createElement("button");
      btn.textContent = "Delete";
      btn.onclick = function() {
        li.remove();
      };

      li.appendChild(btn);
      document.getElementById("list").appendChild(li);
      input.value = "";
    }
  </script>
</body>
</html>
